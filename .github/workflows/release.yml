name: Release

# タグ push（v*）で Windows 向け exe（onedir を zip 固め）をビルドし、
# GitHub Release に添付する。「タグを打てば配布物が出る」状態の維持が目的。
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# 動作検証だけしたい場合は workflow_dispatch で手動実行する
# （Release は作らず、Actions の Artifacts に zip を置く）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: build windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build (PyInstaller onedir)
        run: pyinstaller game.spec --noconfirm

      # SDL をダミードライバにしてヘッドレス起動し、起動直後にクラッシュしないことを確認する。
      # 15秒生存＝アセット解決・pygame 初期化・タイトル画面までは通っている。
      - name: Smoke test (launch exe, ensure it survives 15s)
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $p = Start-Process -FilePath dist/InfuruToNoShito/InfuruToNoShito.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "exe exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force

      # 日本語ファイル名のアセットがあるため、UTF-8 フラグ付き zip を作れる
      # Python の zipfile（shutil.make_archive）で固める。Compress-Archive は使わない。
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('InfuruToNoShito-win64', 'zip', 'dist', 'InfuruToNoShito')"

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: InfuruToNoShito-win64
          path: InfuruToNoShito-win64.zip

      - name: Create GitHub Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" InfuruToNoShito-win64.zip --title "${{ github.ref_name }}" --generate-notes
