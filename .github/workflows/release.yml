name: Release

# タグ push（v*）で Windows 向け exe（onedir を zip 固め）をビルドし、
# GitHub Release に添付する。「タグを打てば配布物が出る」状態の維持が目的。
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# 動作検証だけしたい場合は workflow_dispatch で手動実行する
# （Release は作らず、Actions の Artifacts に zip を置く）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: build windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      # Validate the exact tagged/manual commit, regardless of other CI runs.
      - name: Byte-compile release commit
        run: python tools/run.py pycompile

      - name: Check release commit
        run: python tools/run.py check

      - name: Test release commit
        run: python tools/run.py test

      - name: Assert production optimization
        shell: pwsh
        run: |
          if (-not (Select-String -Path game.spec -Pattern '^\s*optimize=1,\s*$' -Quiet)) {
            throw "game.spec must set Analysis(optimize=1) so release builds disable __debug__ UI"
          }

      - name: Build (PyInstaller onedir)
        run: pyinstaller game.spec --noconfirm

      # Real EXE, external cwd, all stages and isolated user-data save/reload.
      # This headless check is not a native GUI campaign-completion test.
      - name: Packaged runtime smoke
        run: python tools/run_packaged_smoke.py

      - name: Upload packaged smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-runtime-smoke
          path: build-reports/packaged-smoke.json
          if-no-files-found: ignore

      # 日本語ファイル名のアセットがあるため、UTF-8 フラグ付き zip を作れる
      # Python の zipfile（shutil.make_archive）で固める。Compress-Archive は使わない。
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('InfuruToNoShito-win64', 'zip', 'dist', 'InfuruToNoShito')"

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: InfuruToNoShito-win64
          path: InfuruToNoShito-win64.zip

      - name: Create GitHub Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" InfuruToNoShito-win64.zip --title "${{ github.ref_name }}" --generate-notes
